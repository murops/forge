name: forge

x-backend: &backend
  build: ./backend
  environment: &backend-env
    DATABASE_URL: postgres://forge:forge@postgres:5432/forge?sslmode=disable
    LOG_LEVEL: info

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: forge
      POSTGRES_PASSWORD: forge
      POSTGRES_DB: forge
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "forge", "-d", "forge"]
      interval: 2s
      timeout: 3s
      retries: 15

  keycloak:
    image: quay.io/keycloak/keycloak:26.6
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./deploy/keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      # no curl in the image
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  migrate:
    <<: *backend
    command: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *backend
    command: ["api"]
    environment:
      <<: *backend-env
      OIDC_ISSUER: http://localhost:8080/realms/forge
      OIDC_DISCOVERY_URL: http://keycloak:8080/realms/forge
      OIDC_AUDIENCE: forge-api
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
    restart: unless-stopped

  worker:
    <<: *backend
    command: ["worker"]
    environment:
      <<: *backend-env
      GITHUB_ORG: murops-forge
      WORKER_CONCURRENCY: "5"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  riverui:
    image: ghcr.io/riverqueue/riverui:latest
    environment:
      DATABASE_URL: postgres://forge:forge@postgres:5432/forge?sslmode=disable
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
