# throwaway Postgres and Keycloak for the chart e2e test, not for real use
apiVersion: v1
kind: Namespace
metadata:
  name: forge
---
apiVersion: v1
kind: Namespace
metadata:
  name: keycloak
---
apiVersion: v1
kind: Secret
metadata:
  name: forge-db
  namespace: forge
stringData:
  uri: postgres://forge:forge@postgres:5432/forge?sslmode=disable
---
apiVersion: v1
kind: Secret
metadata:
  name: forge-frontend
  namespace: forge
stringData:
  AUTH_SECRET: e2e-only-secret-e2e-only-secret-e2e
  AUTH_KEYCLOAK_SECRET: forge-web-local-secret
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: forge
spec:
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:18-alpine
          env:
            - name: POSTGRES_USER
              value: forge
            - name: POSTGRES_PASSWORD
              value: forge
            - name: POSTGRES_DB
              value: forge
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "forge", "-d", "forge"]
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: forge
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: keycloak
spec:
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.6
          args: ["start-dev", "--import-realm"]
          env:
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: admin
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              value: admin
            # fixed issuer, so tokens fetched through a port-forward still match what the API expects
            - name: KC_HOSTNAME
              value: http://keycloak.keycloak.svc:8080
            - name: KC_HEALTH_ENABLED
              value: "true"
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 9000
          readinessProbe:
            httpGet:
              path: /health/ready
              port: management
            periodSeconds: 5
            failureThreshold: 60
          volumeMounts:
            - name: realm
              mountPath: /opt/keycloak/data/import
              readOnly: true
      volumes:
        - name: realm
          configMap:
            name: forge-realm
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: keycloak
spec:
  selector:
    app: keycloak
  ports:
    - name: http
      port: 8080
      targetPort: http
