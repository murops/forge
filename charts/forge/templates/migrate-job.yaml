apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "forge.fullname" . }}-migrate
  labels:
    {{- include "forge.componentLabels" (list . "migrate") | nindent 4 }}
  annotations:
    # Argo CD runs these as PreSync hooks
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migrate.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migrate.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "forge.selectorLabels" (list . "migrate") | nindent 8 }}
    spec:
      restartPolicy: Never
      # pre-install hooks run before the chart ServiceAccount exists
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "forge.backendPodSecurityContext" . | nindent 8 }}
      containers:
        - name: migrate
          image: {{ include "forge.image" (list . .Values.api.image) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["migrate"]
          env:
            {{- include "forge.databaseEnv" . | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.migrate.resources | nindent 12 }}
