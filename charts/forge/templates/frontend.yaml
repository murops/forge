{{- if .Values.frontend.enabled }}
{{- $f := .Values.frontend }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "forge.fullname" . }}-frontend
  labels:
    {{- include "forge.componentLabels" (list . "frontend") | nindent 4 }}
spec:
  {{- if not $f.autoscaling.enabled }}
  replicas: {{ $f.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "forge.selectorLabels" (list . "frontend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "forge.selectorLabels" (list . "frontend") | nindent 8 }}
      {{- with $f.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "forge.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml (mergeOverwrite (dict "runAsUser" 1000 "runAsGroup" 1000 "fsGroup" 1000) (deepCopy .Values.podSecurityContext)) | nindent 8 }}
      containers:
        - name: frontend
          image: {{ include "forge.image" (list . $f.image) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: PORT
              value: {{ $f.port | quote }}
            - name: AUTH_URL
              value: {{ $f.url | quote }}
            - name: AUTH_KEYCLOAK_ID
              value: {{ $f.auth.clientId | quote }}
            - name: AUTH_KEYCLOAK_ISSUER
              value: {{ default .Values.oidc.issuer $f.issuer | quote }}
            - name: FORGE_API_URL
              value: http://{{ include "forge.fullname" . }}-api:{{ .Values.api.port }}
          envFrom:
            - secretRef:
                name: {{ required "frontend.auth.existingSecret is required" $f.auth.existingSecret }}
          ports:
            - name: http
              containerPort: {{ $f.port }}
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /
              port: http
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml $f.resources | nindent 12 }}
          volumeMounts:
            - name: cache
              mountPath: /app/.next/cache
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: cache
          emptyDir:
            sizeLimit: 256Mi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
      {{- with $f.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $f.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $f.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "forge.selectorLabels" (list . "frontend") | nindent 14 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "forge.fullname" . }}-frontend
  labels:
    {{- include "forge.componentLabels" (list . "frontend") | nindent 4 }}
spec:
  selector:
    {{- include "forge.selectorLabels" (list . "frontend") | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
{{- end }}
